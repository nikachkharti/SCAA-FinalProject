name: scaa

services:
  scaa-final-web:
    image: ${DOCKER_REGISTRY-}scaa-final-web
    container_name: scaa-final-web
    build:
      context: .
      dockerfile: SCAA-Final-Web/Dockerfile
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    restart: unless-stopped
